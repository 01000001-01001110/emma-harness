# Builds the binary for macOS and Windows on every push to `main`, and keeps
# each build as a workflow artifact for a fortnight.
#
# This is not a release. `release.yml` still fires on tags only, and its
# reasoning stands: a tag is a person's claim that a commit is worth running.
# This workflow answers a different question, asked of every commit: does
# `main` still build on the two platforms the owner uses, and can somebody
# fetch that build without a toolchain? The artifact is dated by its run and
# expires, so it never reads as a release.
#
# Linux is left out on purpose. Nobody here runs it, and each platform in the
# matrix is a paid minute on a private-credit budget; macOS minutes cost ten
# times Linux ones. Add it when somebody is going to open the artifact.
#
# The suite gates the build on both platforms, for the same reason as in
# `release.yml`: a binary from a commit that fails its own tests is not worth
# the minutes it took.
#
# **It ran on Windows alone until 2026-09-06, and that was a hole rather than a
# saving.** This project has whole features that exist only on unix -- the
# harness page's pause, resume and cancel send signals Windows has no
# equivalent of -- so the platform where those paths are actually taken was the
# one nothing tested. A macOS review of the fork port found two failures a
# green Windows run had not: a prose gate that lives in another crate's test
# binary, and a fixture that respelled a URI in a way that is right on Windows
# and names a different file on a case-sensitive file system. Both were found
# by hand on a Mac. This job is that check, made to happen on its own.
#
# The cost is real and is the reason to say it out loud: macOS minutes bill at
# ten times Linux ones, and this roughly doubles the workflow's spend. It buys
# the difference between a suite that passes and a suite that passes where the
# code runs.
name: build

on:
  push:
    branches:
      - main
      # The fork port: every push gets the macOS and Windows build the merge
      # bar requires, before the review rather than after it.
      - port/mac-fork
      # **Every working branch, by pattern, and the reason is a branch that
      # went four commits with no CI at all.** Naming branches one at a time
      # means the workflow is edited at the start of each piece of work, which
      # is exactly when nobody thinks about it: the macOS half of the matrix
      # had not run once on `lsp/intellisense`, on work whose whole subject is
      # a terminal drawing colours.
      - "lsp/**"
      - "feat/**"
      - "fix/**"


permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      # Both, always: a failure on one platform must not hide the other's
      # result, which is the same argument `--no-fail-fast` makes one level
      # down.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # The first three runs of this workflow hung inside `cargo test` for hours
    # with no log to read, because a running job's log is not served. A
    # timeout turns a hang into a failure with a log attached.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      # Formatting is a property of the source and genuinely cannot differ by
      # platform, so it runs once and the second run would be minutes spent to
      # learn the same thing.
      - name: fmt
        if: matrix.os == 'windows-latest'
        run: cargo fmt --all -- --check

      # **Clippy runs on both, and the sentence above used to cover it.** That
      # was wrong, and it hid a real finding for as long as this workflow has
      # existed: `dead_code` is evaluated after `cfg`, so a function whose only
      # caller is behind `#[cfg(windows)]` is live on Windows and dead on
      # macOS. `bounded_dimensions` in `tools/screenshot` was exactly that, and
      # the first macOS clippy run in this repository's history failed on it.
      # A lint that reads the same source can still reach a different answer
      # when the source it compiles is not the same source.
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # --no-fail-fast because cargo stops at the first failing target, and a
      # run that reports two failures while fourteen targets never ran reads
      # as a smaller problem than it is.
      - name: test
        run: cargo test --workspace --no-fail-fast

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: emma.exe
            asset: emma-x86_64-windows.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: emma
            asset: emma-aarch64-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }} --bin emma

      # The artifact carries the short commit in its name so two downloads
      # from different runs cannot be confused on a desktop.
      - name: name the artifact
        id: name
        shell: bash
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}-${{ steps.name.outputs.sha }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}
          retention-days: 14
          if-no-files-found: error
