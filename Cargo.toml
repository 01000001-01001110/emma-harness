[workspace]
resolver = "2"
members = [
    "crates/tool-api",
    "crates/harness",
    "crates/llm",
    "crates/emma",
    "tools/fs",
    "tools/lsp",
    "tools/web",
    "tools/tasks",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
# Chrome over the DevTools Protocol, for `tools/web`. The alternative to
# driving a real browser is an HTTP client plus an HTML-to-markdown crate,
# which returns an empty shell for every page built with JavaScript and a 406
# for several that are worth reading. `futures` (not just `futures-util`) is
# chromiumoxide's own event-stream vocabulary.
chromiumoxide = "0.9"
futures = "0.3"
futures-util = "0.3"
globset = "0.4"
# UTS-46, used in exactly one place: composing the boot warning that tells an
# operator what their non-ASCII `domain:` rule would have to be spelled as.
# **Not** in the matcher — see `permissions.rs`, which stays byte-for-byte
# ASCII comparison, because a conversion bug there can widen a match and a bug
# here costs a wrong suggestion in a sentence. It compiles nothing new: `url`
# (via `tools/web`) already pulls the same version in. Licence read from the
# crate's own files rather than a badge, 2026-08-14: `LICENSE-MIT` is the
# unmodified MIT text, "Copyright (c) 2013-2025 The rust-url developers", and
# `LICENSE-APACHE` is the unmodified Apache-2.0 text — no rider, no additional
# term, nothing naming a party.
idna = "1"
# Unix only, and only to ask how big the window is (`TIOCGWINSZ`). Windows
# answers the same question through the console API, which is already a
# dependency; this is the other half of one question, not a platform layer.
libc = "0.2"
# rustls rather than the platform TLS stack: one code path on every machine the
# agent runs on, and no OpenSSL to find at build time.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
regex = "1"
# Reading a key without echoing it. The alternative is `stty -echo` on unix and
# a PowerShell subprocess on Windows — two platform paths, spawned at the exact
# moment a secret is on the wire, to avoid one small crate.
rpassword = "7"
tempfile = "3"
thiserror = "2"
walkdir = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "fs"] }
tracing = "0.1"
url = "2"
# Windows only. Three callers, three different reasons: `tools/web` needs a
# Chrome that survives the command that opened it (an ordinary child does not);
# `crates/emma` needs a CreateProcessW that inherits no handles; and `tools/fs`
# needs a file's hard-link count, which std exposes only behind the unstable
# `windows_by_handle` feature — see `path::hard_links`.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

emma-tool-api = { path = "crates/tool-api" }
emma-harness = { path = "crates/harness" }
emma-llm = { path = "crates/llm" }
emma-tools-fs = { path = "tools/fs" }
emma-tools-lsp = { path = "tools/lsp" }
emma-tools-web = { path = "tools/web" }
emma-tools-tasks = { path = "tools/tasks" }
