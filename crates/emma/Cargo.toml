[package]
name = "emma"
version.workspace = true
edition.workspace = true

# A library as well as a binary, and that is not packaging taste: the loop is
# the only thing in this repository that cannot be tested through a public API
# unless it has one. `main.rs` is argument parsing and wiring; everything with a
# decision in it lives in the lib, where a scripted `Provider` can drive it.
[lib]
name = "emma"
path = "src/lib.rs"

[[bin]]
name = "emma"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
# `signal` for Ctrl-C, `sync` for the event and stdin channels. Nothing here
# spawns a process: the tools do that, behind the approval gate.
tokio = { workspace = true, features = ["signal", "sync"] }

emma-harness.workspace = true
emma-llm.workspace = true
emma-tool-api.workspace = true
emma-tools-fs.workspace = true
emma-tools-tasks.workspace = true
# Code intelligence over LSP. Registered unconditionally, unlike `web_tools`: a
# missing rust-analyzer produces an `Unavailable` naming what was looked for,
# what it rejected and both ways to fix it, which is strictly more useful to the
# model than the tool being absent — and the server can be installed mid-session.
emma-tools-lsp.workspace = true
# The web surface. It costs a Chrome dependency at build time and registers
# nothing at run time unless a browser and a key are actually there — see
# `web_tools`, and the registration in `main.rs` that reports what it left out.
emma-tools-web.workspace = true
# The terminal UI. `Viewport::Inline` is the whole reason it is here: a widget
# tree rendered into the *normal* screen buffer, with ordinary output above it
# that the terminal keeps in scrollback. No alternate screen — that costs
# scrollback and mouse selection, and Emma's output is a transcript people read
# after the run.
#
# **`scrolling-regions` must stay off.** With it enabled, `insert_before` is
# implemented with `ESC[{top};{bottom}r`, and a DEC scrolling region whose top
# margin is below row 1 discards the lines that leave it — which is exactly the
# defect that shipped here once and could not scroll. `term/frame.rs` asserts
# this manifest never names it.
#
# `default-features = false` also drops `underline-color`, which is an escape
# sequence several terminals answer by printing garbage, and nothing here uses.
# crossterm is not a separate dependency: it is re-exported as
# `ratatui::crossterm`, so the two can never drift to versions that disagree
# about what a `KeyEvent` is.
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }

# Two questions ratatui does not answer: how big is the *window* as opposed to
# the screen buffer, and did VT processing actually turn on. Both are one
# syscall, and both are load-bearing on Windows — see `term.rs`.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Console"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
