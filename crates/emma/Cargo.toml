[package]
name = "emma"
version.workspace = true
edition.workspace = true

# A library as well as a binary, and that is not packaging taste: the loop is
# the only thing in this repository that cannot be tested through a public API
# unless it has one. `main.rs` is argument parsing and wiring; everything with a
# decision in it lives in the lib, where a scripted `Provider` can drive it.
[lib]
name = "emma"
path = "src/lib.rs"

[[bin]]
name = "emma"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
# Only to spell a warning correctly. See the workspace manifest, and the
# `domain:` note branch in `permissions.rs` — the matcher does no IDNA and is
# not going to.
idna.workspace = true
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
# `signal` for Ctrl-C, `sync` for the event and stdin channels. Nothing here
# spawns a process: the tools do that, behind the approval gate.
tokio = { workspace = true, features = ["signal", "sync"] }

# One method: `FutureExt::catch_unwind`, used in `agent.rs` so a panicking tool
# becomes a `tool_result` the model reads rather than the end of the session.
# The loop's first rule is that every failure class is an observation, and a
# panic was the only one that was not. Already in the lock file via `tools/web`.
# Permission path specifiers — `Read(./src/**)`, `Edit(/etc/**)`. The same
# crate `tools/fs` globs with, so a rule and a `Glob` call agree about what a
# pattern means; two glob dialects in one program is how a rule starts matching
# something the user did not write.
globset.workspace = true

futures-util.workspace = true

emma-harness.workspace = true
emma-llm.workspace = true
emma-tool-api.workspace = true
emma-tools-fs.workspace = true
emma-tools-tasks.workspace = true
# Code intelligence over LSP. Registered unconditionally, unlike `web_tools`: a
# missing rust-analyzer produces an `Unavailable` naming what was looked for,
# what it rejected and both ways to fix it, which is strictly more useful to the
# model than the tool being absent — and the server can be installed mid-session.
emma-tools-lsp.workspace = true
# The web surface. It costs a Chrome dependency at build time and registers
# nothing at run time unless a browser and a key are actually there — see
# `web_tools`, and the registration in `main.rs` that reports what it left out.
emma-tools-web.workspace = true
# The terminal UI. Two interactive frames since 2026-08-12 (stage 2 of
# notes/design/tui-fullscreen.md): the default is `Viewport::Fullscreen` on the
# alternate screen — the owner chose a multi-pane layout that cannot be drawn
# inline, knowing it costs terminal scrollback and native mouse selection; the
# design's §2 prices the trade and term/ carries the replacements — and the old
# `Viewport::Inline` frame survives behind `EMMA_UI=inline` for one release as
# the soak-period escape hatch.
#
# **`scrolling-regions` must stay off, still.** With it enabled, the inline
# path's `insert_before` is implemented with `ESC[{top};{bottom}r`, and a DEC
# scrolling region whose top margin is below row 1 discards the lines that
# leave it — which is exactly the defect that shipped here once and could not
# scroll. The inline path ships for as long as the escape hatch does, and off
# costs nothing after it dies. `term/frame.rs` asserts this manifest never
# names the feature.
#
# `default-features = false` also drops `underline-color`, which is an escape
# sequence several terminals answer by printing garbage, and nothing here uses.
# crossterm is not a separate dependency: it is re-exported as
# `ratatui::crossterm`, so the two can never drift to versions that disagree
# about what a `KeyEvent` is.
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }

# Two questions ratatui does not answer: how big is the *window* as opposed to
# the screen buffer, and did VT processing actually turn on. Both are one
# syscall, and both are load-bearing on Windows — see `term.rs`.
#
# Threading + Foundation are for `usertools.rs`: opening a shell in its own
# console window needs a CreateProcessW that inherits no handles, which
# `std::process` cannot express — std always passes the parent's std handles
# when the parent has any, and a shell holding Emma's console handles writes
# into Emma's screen. Same precedent as `tools/web`'s detached Chrome.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_Foundation",
] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
