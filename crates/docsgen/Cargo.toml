[package]
name = "emma-docsgen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "emma_docsgen"
path = "src/lib.rs"

[[bin]]
name = "emma-docsgen"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
# The diagrams are drawn from Rust source, so the source is parsed rather than
# matched with regexes: an enum variant behind a `#[cfg]`, a doc comment
# containing a brace, or a field whose type spans two lines all defeat a
# pattern and none of them defeat a parser. Already in the lock file via serde,
# so this adds no download.
syn = { version = "2", features = ["full", "extra-traits", "visit"] }
# The README's tool list is the registry a run assembles, built the way
# `crates/emma/src/main.rs` and `crates/emma/tests/prompt_size.rs` build it,
# so the names are what `Tool::name` returns at runtime rather than a reading
# of the source. Only the three unconditional surfaces: `tools/web` and the
# harness register on conditions this machine may not meet, and those names
# are read from source in `pages/readme.rs` instead.
emma-tool-api.workspace = true
emma-tools-fs.workspace = true
emma-tools-tasks.workspace = true
emma-tools-screenshot.workspace = true
emma-tools-lsp.workspace = true
# `syn` alone can say a function exists; it cannot say which lines of the file
# it occupies, and a quoted block has to come out of the file byte for byte.
# `span-locations` is what turns a parsed item back into a line range. It is a
# non-default feature, so it is named here rather than inherited: enabling it
# costs proc-macro2 a line-offset table it otherwise skips, workspace-wide via
# feature unification, which is the price of not writing a second brace-matcher.
proc-macro2 = { version = "1", features = ["span-locations"] }
